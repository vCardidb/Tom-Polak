<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Polak | Levata</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#111;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
      font-family:'Segoe UI', Arial, sans-serif;
    }

    .card{
      width:1200px;
      height:700px;
      border-radius:20px;
      overflow:hidden;
      position:relative;

      /* Verlauf von OBEN nach UNTEN */
      background:linear-gradient(
        to bottom,
        #a347a5 0%,
        #7162bb 55%,
        #0076c8 100%
      );

      color:white;
    }

    /* LEVATA LINKS */
    .logo{
      position:absolute;
      left:70px;
      top:50%;
      transform:translateY(-50%) rotate(-90deg);

      font-size:100px;
      font-weight:700;
      letter-spacing:1px;
      text-transform:lowercase;
    }

    /* MITTLERER BEREICH */
    .center{
      position:absolute;
      left:300px;
      top:50%;
      transform:translateY(-50%);
    }

    .name{
      font-size:78px;
      font-weight:300;
      line-height:1.05;
      margin-bottom:35px;
    }

    .title{
      font-size:60px;
      font-weight:300;
      line-height:1.15;
    }

    /* TRENNLINIE */
    .divider{
      position:absolute;
      left:710px;
      top:50%;
      transform:translateY(-50%);
      width:5px;
      height:240px;
      background:white;
      border-radius:20px;
      opacity:0.95;
    }

    /* RECHTE SEITE */
    .right{
      position:absolute;
      right:80px;
      top:50%;
      transform:translateY(-50%);
      text-align:left;
    }

    .contact{
      font-size:36px;
      font-weight:300;
      line-height:1.9;
      letter-spacing:0.5px;
    }

    .website{
      margin-top:45px;
      font-size:48px;
      font-weight:300;
    }

    .website a{
      color:white;
      text-decoration:none;
    }

    .website a:hover{
      opacity:0.8;
    }

    /* RESPONSIVE */
    @media(max-width:900px){

      .card{
        width:100%;
        height:auto;
        padding:50px 40px;
      }

      .logo{
        position:relative;
        left:auto;
        top:auto;
        transform:none;
        margin-bottom:50px;
        font-size:72px;
      }

      .center,
      .right,
      .divider{
        position:relative;
        left:auto;
        right:auto;
        top:auto;
        transform:none;
      }

      .divider{
        width:100%;
        height:4px;
        margin:40px 0;
      }

      .name{
        font-size:50px;
      }

      .title{
        font-size:38px;
      }

      .contact{
        font-size:24px;
      }

      .website{
        font-size:34px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      levata
    </div>

    <div class="center">

      <div class="name">
        Tom<br>
        Polak
      </div>

      <div class="title">
        Finance Director
      </div>

    </div>

    <div class="divider"></div>

    <div class="right">

      <div class="contact">
        +44 7837 501798<br>
        tom.polak@levata.com
      </div>

      <div class="website">
        <a href="https://www.levata.com" target="_blank">
          levata.com
        </a>
      </div>

    </div>

  </div>

</body>
</html>
